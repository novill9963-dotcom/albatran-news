<script>
/* NOVILL — حفظ بيانات الطلاب عند تحديث المنصة */
(function () {
  const CURRENT_SCHEMA = 2;
  const FLAG = "novill_storage_schema";
  try {
    // Keep all existing novill_* records intact across UI/code updates.
    // If an older schema exists, migrate forward without deleting user data.
    const old = Number(localStorage.getItem(FLAG) || "1");
    if (old < CURRENT_SCHEMA) {
      const keys = [
        "novill_users","novill_posts","novill_notifications","novill_exams",
        "novill_messages","novill_read","novill_prizes","novill_currentUser",
        "novill_king_token_2025_secure"
      ];
      const backup = {};
      keys.forEach(k => {
        const v = localStorage.getItem(k);
        if (v !== null) backup[k] = v;
      });
      localStorage.setItem("novill_data_backup_v" + old, JSON.stringify(backup));
      localStorage.setItem(FLAG, String(CURRENT_SCHEMA));
    }
  } catch (e) {
    console.warn("تعذر حفظ نسخة احتياطية محلية:", e);
  }
})();
</script>

<script>
(function(){
  const btn=document.createElement('button');
  btn.id='albatran-ai-btn'; btn.textContent='🤖 مساعد البطران';
  const box=document.createElement('div'); box.id='albatran-ai-box';
  box.innerHTML=`<div id="albatran-ai-head"><div><b>🤖 مساعد البطران الذكي</b><div style="font-size:11px;opacity:.8">اسألني عن المنصة والدراسة</div></div><button id="ai-close" style="color:#fff;background:none;border:0;font-size:22px">×</button></div>
  <div id="albatran-ai-msgs"><div class="ai-msg ai-bot">أهلاً بيك 👋<br>أنا مساعد البطران. اسألني عن الأقسام، الفرق، المحاضرات، الامتحانات أو الملفات.</div></div>
  <form id="albatran-ai-form"><input id="albatran-ai-input" placeholder="اكتب سؤالك هنا..." autocomplete="off"><button id="albatran-ai-send">إرسال</button></form>`;
  document.body.appendChild(btn); document.body.appendChild(box);

  const msgs=box.querySelector('#albatran-ai-msgs'), input=box.querySelector('#albatran-ai-input');
  btn.onclick=()=>{box.style.display='block';input.focus()};
  box.querySelector('#ai-close').onclick=()=>box.style.display='none';

  function answer(q){
    q=q.trim().toLowerCase();
    if(!q) return 'اكتب سؤالك الأول وأنا هساعدك 😊';
    if(/اهلا|أهلا|السلام|هاي|hello/.test(q)) return 'أهلاً وسهلاً بيك 👋 قولّي محتاج إيه؟';
    if(/امتحان|اختبار/.test(q)) return 'تقدر تستخدم قسم الامتحانات والاختبارات التجريبية في المنصة. ولو عايز، اكتب اسم المادة والفرقة وأنا أوجّهك للمكان المناسب.';
    if(/محاضر|محاضرات|ميعاد|موعد/.test(q)) return 'مواعيد المحاضرات بتكون من قسم المواعيد في المنصة. اختار الفرقة والقسم علشان تشوف الجدول المناسب ليك.';
    if(/قسم|اقسام|تخصص/.test(q)) return 'المنصة معمولة علشان كل قسم وكل فرقة يكون ليهم المحتوى الخاص بيهم، زي المواد والملفات والمواعيد والاختبارات.';
    if(/كتاب|كتب|ملف|ملفات|مذكر/.test(q)) return 'هتلاقي الملفات والكتب الخاصة بيك جوه قسم المواد/الملفات حسب القسم والفرقة.';
    if(/مساعد|ذكاء|ai/.test(q)) return 'أنا المساعد الذكي الموجود جوه المنصة 🤖. حالياً شغال من غير مفتاح API أو سيرفر، وبيساعدك في التنقل وفهم أقسام المنصة.';
    if(/شكرا|شكراً/.test(q)) return 'العفو يا بطل ❤️ أي وقت!';
    return 'فاهمك 👍 بس السؤال ده محتاج بيانات المنصة نفسها. جرّب تسألني عن: الأقسام، الفرق، المواد، الكتب، المحاضرات أو الامتحانات.';
  }

  box.querySelector('#albatran-ai-form').onsubmit=(e)=>{
    e.preventDefault();
    const q=input.value.trim(); if(!q) return;
    msgs.insertAdjacentHTML('beforeend',`<div class="ai-msg ai-user"></div>`);
    msgs.lastElementChild.textContent=q;
    input.value='';
    setTimeout(()=>{
      msgs.insertAdjacentHTML('beforeend',`<div class="ai-msg ai-bot"></div>`);
      msgs.lastElementChild.textContent=answer(q);
      msgs.scrollTop=msgs.scrollHeight;
    },250);
    msgs.scrollTop=msgs.scrollHeight;
  };
})();
</script>

    if(!window.supabase){badge.textContent="☁️ المنصة تعمل بدون سحابة";badge.style.color="#ffb4b4";return;}
    try{
      window.__albatranSupabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      badge.textContent="☁️ متصل";
      badge.style.color="#D4AF37";
    }catch(e){badge.textContent="☁️ تعذر الاتصال";badge.style.color="#ffb4b4";}
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",ready); else ready();
})();
</script>
</body>
